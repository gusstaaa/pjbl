name: keepalive-banco

on:
  schedule:
    - cron: "17 6 * * 1,4" # Toda segunda e quinta às 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Healthcheck de Banco de Dados
        run: |
          if [ -n "${{ secrets.URL_HEALTH_DB }}" ]; then
            echo "Disparando ping para ${{ secrets.URL_HEALTH_DB }}..."
            curl -fsS "${{ secrets.URL_HEALTH_DB }}"
          else
            echo "URL_HEALTH_DB ainda não definida nas Secrets do repositório GitHub. Pule este passo até a publicação do banco em nuvem."
          fi
